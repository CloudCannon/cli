    yaml: |-
      _inputs:
        price:
          type: object
          options:
            structures:
              values:
                - label: First
                  value: {}
                - label: Second
  - ref: ../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- validate . --configuration 2>&1 || true
