name: cloudcannon validate --routing [invalid]

steps:
  - step: I have a "cloudcannon.config.yml" file with the content {yaml}
    yaml: |-
      collections_config:
        posts:
          path: _posts
  - step: I have a ".cloudcannon/routing.json" file with the content {json}
    json: |-
      {
        "routes": [
          { "from": ["/old-page"], "two": "/new-page", "status": 999 }
        ]
      }
  - ref: ../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- validate . --routing 2>&1 || true
  - snapshot: stdout
    snapshot_content: |-
      ╎✗ invalid: .cloudcannon/routing.json
      ╎  $.routes[0]: must have required property to
      ╎  $.routes[0]: unexpected property two
      ╎  $.routes[0].from: unexpected type array, allowed types: string
      ╎  $.routes[0].status: unexpected value 999, allowed values: 200, 301, 302, 303, 307, 308, 404, 410
