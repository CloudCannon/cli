name: cloudcannon validate --stdin [valid]

steps:
  - step: I have a "thing.yml" file with the content {yaml}
    yaml: |-
      collections_config:
        posts:
          path: _posts
  - ref: ../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      cat thing.yml | npm -s run cloudcannon -- validate --stdin --configuration
  - snapshot: stdout
    snapshot_content: |-
      ╎✓ valid: <stdin>
