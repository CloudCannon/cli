name: cloudcannon validate [invalid]

steps:
  - step: I have a "cloudcannon.config.yml" file with the content {yaml}
    yaml: |-
      version: newest
      source: src
      collections_config:
        posts:
          path: content/blog
          icon: nature_person
          create: 5000
        data:
          icon: date_usage
      _select_datasets:
        colors:
          - Red
          - Green
          - Blue
      _inputs:
        date:
          type: datetime
          instance_value: now
        who_knows:
          comment: hello
  - ref: ../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- validate . 2>&1 || true
  - snapshot: stdout
    snapshot_content: |-
      ╎✗ invalid: cloudcannon.config.yml
      ╎  $: unexpected property _select_datasets
      ╎  $.version: value newest should be latest
      ╎  $._inputs.date.instance_value: unexpected value now, allowed values: UUID, NOW
      ╎  $.collections_config.data: must have required property path
      ╎  $.collections_config.data.icon: unexpected value date_usage, allowed values: 3584 values (closest: data_usage)
      ╎  $.collections_config.posts.icon: unexpected value nature_person, allowed values: 3584 values (closest: nature_people)
      ╎  $.collections_config.posts.create: unexpected type number, allowed types: object
