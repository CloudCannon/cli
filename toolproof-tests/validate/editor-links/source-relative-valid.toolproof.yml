name: cloudcannon validate --editor-links [source-relative path]

steps:
  - step: I have a "cloudcannon.config.yml" file with the content {yaml}
    yaml: |-
      source: site
      collections_config:
        pages:
          path: content/pages
  - step: I have a "site/content/pages/index.md" file with the content {content}
    content: |-
      ---
      title: Home
      ---
  - step: I have a ".cloudcannon/README.md" file with the content {content}
    content: |-
      - [Home](cloudcannon:collections/pages:/edit?collection=pages&path=%2Fcontent%2Fpages%2Findex.md)
  - ref: ../../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- validate . --editor-links 2>&1 || true
  - snapshot: stdout
    snapshot_content: |-
      ╎✓ valid: editor links (1 checked)
