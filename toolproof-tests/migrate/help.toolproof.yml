name: cloudcannon migrate --help

steps:
  - ref: ../core/run-cli.toolproof.yml
  - I run "npm -s run cloudcannon -- migrate --help | sed 's/[[:space:]]*$//'"
  - snapshot: stdout
    snapshot_content: |-
      ╎Migrate CloudCannon resources. (cloudcannon migrate v0.0.0)
      ╎
      ╎USAGE cloudcannon migrate convert-redirect-sites-to-subdomains
      ╎
      ╎COMMANDS
      ╎
      ╎  convert-redirect-sites-to-subdomains    In November 2026, CloudCannon introduced a new way to redirect all traffic from one host to another. This command scans an Organization for Sites with Custom Domains using .cloudcannon/routing.json to redirect all traffic. It then offers to change the serving mode for each of those Subdomains, so that it redirects to the same host with this new strategy.
      ╎
      ╎We encourage you to double-check the results before confirming, to ensure no unintentional changes are made.
      ╎
      ╎
      ╎Use cloudcannon migrate <command> --help for more information about a command.
      ╎
  - I run "npm -s run cloudcannon -- migrate convert-redirect-sites-to-subdomains --help | sed 's/[[:space:]]*$//'"
  - snapshot: stdout
    snapshot_content: |-
      ╎In November 2026, CloudCannon introduced a new way to redirect all traffic from one host to another. This command scans an Organization for Sites with Custom Domains using .cloudcannon/routing.json to redirect all traffic. It then offers to change the serving mode for each of those Subdomains, so that it redirects to the same host with this new strategy.
      ╎
      ╎We encourage you to double-check the results before confirming, to ensure no unintentional changes are made.
      ╎ (migrate convert-redirect-sites-to-subdomains)
      ╎
      ╎USAGE migrate convert-redirect-sites-to-subdomains [OPTIONS] 
      ╎
      ╎OPTIONS
      ╎
      ╎  --org=<name|id|uuid>    The Organization name, ID, or UUID
      ╎
      ╎
