name: cloudcannon configure validate [invalid]

steps:
  - step: I have a "cloudcannon.config.yml" file with the content {yaml}
    yaml: |-
      version: newest
      source: src
      collections_config:
        posts:
          path: content/blog
          icon: nature_person
          create: 5000
        data:
          icon: date_usage
      _select_datasets:
        colors:
          - Red
          - Green
          - Blue
      _inputs:
        date:
          type: datetime
          instance_value: now
        who_knows:
          comment: hello
  - ref: ../../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- configure validate . 2>&1 | sed 's|/.*/||'
  - snapshot: stdout
    snapshot_content: |-
      ╎✗ invalid: cloudcannon.config.yml
      ╎  $: unexpected property '_select_datasets'
      ╎  $.version: value 'newest' should be 'latest'
      ╎  $.collections_config.posts.icon: unexpected value 'nature_person', allowed values: '123', '360', '10k', '10mp', '11mp' and 3579 more
      ╎  $.collections_config.posts.create: unexpected type number instead of object
      ╎  $.collections_config.data: must have required property 'path'
      ╎  $.collections_config.data.icon: unexpected value 'date_usage', allowed values: '123', '360', '10k', '10mp', '11mp' and 3579 more
      ╎  $._inputs.date.instance_value: unexpected value 'now', allowed values: 'UUID', 'NOW'
      ╎  $._inputs.date.type: unexpected value 'datetime', allowed values: 'text', 'email', 'disabled', 'pinterest', 'facebook' and 24 more
