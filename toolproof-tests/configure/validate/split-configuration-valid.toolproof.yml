name: cloudcannon configure validate --configuration [valid, with split files]

steps:
  - step: I have a "cloudcannon.config.yml" file with the content {yaml}
    yaml: |-
      collections_config_from_glob:
        - cloudcannon.collections.yml
      _editables_from_glob:
        - cloudcannon.editables.yml
      _inputs_from_glob:
        - cloudcannon.inputs.yml
        - cloudcannon.inputs.json
        - blog.cloudcannon.inputs.yml
      _snippets_from_glob:
        - cloudcannon.snippets.yml
      _snippets_definitions_from_glob:
        - cloudcannon.snippets-definitions.yml
      _snippets_imports_from_glob:
        - cloudcannon.snippets-imports.yml
      _structures_from_glob:
        - cloudcannon.structures.yml
  - step: I have a "cloudcannon.inputs.yml" file with the content {yaml}
    yaml: |-
      date:
        type: date
        label: Date
  - step: I have a "blog.cloudcannon.inputs.yml" file with the content {yaml}
    yaml: |-
      title:
        type: text
        label: Title
  - step: I have a "cloudcannon.inputs.json" file with the content {json}
    json: |-
      {
        "author": { "type": "text", "label": "Author" }
      }
  - step: I have a "cloudcannon.structures.yml" file with the content {yaml}
    yaml: |-
      article:
        values_from_glob:
          - cloudcannon.structure-value.yml
  - step: I have a "cloudcannon.structure-value.yml" file with the content {yaml}
    yaml: |-
      value:
        title: Hello
  - step: I have a "cloudcannon.collections.yml" file with the content {yaml}
    yaml: |-
      posts:
        path: _posts
        schemas_from_glob:
          - cloudcannon.schemas.yml
  - step: I have a "cloudcannon.schemas.yml" file with the content {yaml}
    yaml: |-
      article:
        path: _schemas/article.yml
  - step: I have a "cloudcannon.editables.yml" file with the content {yaml}
    yaml: |-
      content:
        bold: true
        italic: true
  - step: I have a "cloudcannon.snippets.yml" file with the content {yaml}
    yaml: |-
      callout:
        template: '<div>{{content}}</div>'
  - step: I have a "cloudcannon.snippets-definitions.yml" file with the content {yaml}
    yaml: |-
      callout: '<div>{{content}}</div>'
  - step: I have a "cloudcannon.snippets-imports.yml" file with the content {yaml}
    yaml: |-
      mdx: true
  - ref: ../../core/run-cli.toolproof.yml
  - step: I run {command}
    command: |
      npm -s run cloudcannon -- configure validate . --configuration 2>&1 || true
  - snapshot: stdout
    snapshot_content: |-
      ╎✓ valid: cloudcannon.config.yml
      ╎✓ valid: cloudcannon.snippets.yml
      ╎✓ valid: cloudcannon.snippets-imports.yml
      ╎✓ valid: cloudcannon.snippets-definitions.yml
      ╎✓ valid: cloudcannon.collections.yml
      ╎✓ valid: blog.cloudcannon.inputs.yml
      ╎✓ valid: cloudcannon.inputs.json
      ╎✓ valid: cloudcannon.inputs.yml
      ╎✓ valid: cloudcannon.editables.yml
      ╎✓ valid: cloudcannon.structures.yml
      ╎✓ valid: cloudcannon.structure-value.yml
      ╎✓ valid: cloudcannon.schemas.yml
